<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Danh Mục Sản Phẩm | VOLT</title>
    <link
      href="[https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:wght@500;700&display=swap](https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:wght@500;700&display=swap)"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a href="index.html" class="logo">V O L T</a>
        <nav class="main-nav">
          <ul>
            <li><a href="index.html">Trang Chủ</a></li>
            <li><a href="san-pham.html" class="active">Tất Cả Sản Phẩm</a></li>
            <li><a href="lien-he.html">Liên Hệ</a></li>
            <li><a id="auth-link" href="dang-nhap.html">Đăng nhập</a></li>
          </ul>
        </nav>
        <div class="header-actions">
          <form id="header-search-form" class="search-box">
            <input type="text" id="header-search-input" placeholder="Tìm sản phẩm..." />
            <button type="submit" aria-label="Tìm kiếm">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="7"/>
                <path d="M20 20l-3.5-3.5"/>
              </svg>
            </button>
          </form>
          <a href="gio-hang.html" class="cart-icon-btn" aria-label="Giỏ hàng">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 7h12l-1.2 12.1a1 1 0 0 1-1 .9H8.2a1 1 0 0 1-1-.9L6 7z"/>
              <path d="M9 7V6a3 3 0 0 1 6 0v1"/>
            </svg>
            <span class="cart-badge">0</span>
          </a>
        </div>
      </div>
    </header>

    <main class="container section">
      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: flex-end;
          margin-bottom: 24px;
          border-bottom: 1px solid var(--border-color);
          padding-bottom: 16px;
        "
      >
        <div>
          <span class="section-label">DANH MỤC</span>
          <h1 id="category-title" class="section-title" style="margin-bottom: 0">
            Tất Cả Sản Phẩm
          </h1>
          <span id="product-count" style="color: var(--text-secondary); font-size: 0.9rem"></span>
        </div>
        <div style="display: flex; align-items: center; gap: 16px; flex-wrap: wrap">
          <div>
            <label for="cat-select" style="font-size: 0.85rem; font-weight: 600">Loại: </label>
            <select
              id="cat-select"
              class="form-control"
              style="width: auto; display: inline-block; padding: 6px 12px"
            >
              <option value="">Tất cả</option>
              <option value="dien-thoai">Điện Thoại</option>
              <option value="laptop">Laptop</option>
              <option value="am-thanh">Âm Thanh</option>
              <option value="phu-kien">Phụ Kiện</option>
            </select>
          </div>
          <div>
            <label for="sort-select" style="font-size: 0.85rem; font-weight: 600">SẮP XẾP: </label>
            <select
              id="sort-select"
              class="form-control"
              style="width: auto; display: inline-block; padding: 6px 12px"
            >
              <option value="default">Mặc định</option>
              <option value="price-asc">Giá: Thấp đến Cao</option>
              <option value="price-desc">Giá: Cao đến Thấp</option>
            </select>
          </div>
        </div>
      </div>

      <div id="category-product-grid" class="product-grid"></div>
    </main>

    <footer class="site-footer">
      <div class="container footer-grid">
        <div class="footer-col">
          <a href="index.html" class="logo" style="color: white">V O L T</a>
          <p style="margin-top: 12px; color: #aaa">Thương hiệu thiết bị công nghệ cao cấp.</p>
        </div>
        <div class="footer-col">
          <h4>DANH MỤC</h4>
          <ul>
            <li><a href="san-pham.html?cat=dien-thoai">Điện thoại</a></li>
            <li><a href="san-pham.html?cat=laptop">Laptop</a></li>
          </ul>
        </div>
        <div class="footer-col">
          <h4>HỖ TRỢ</h4>
          <ul>
            <li><a href="lien-he.html">Liên hệ</a></li>
          </ul>
        </div>
        <div class="footer-col">
          <h4>LIÊN HỆ</h4>
          <p style="color: #aaa">Hotline: 1900 1234</p>
        </div>
      </div>
      <div class="copyright">© 2026 VOLT Store.</div>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
